name: Validate repository files

# GitHub silently drops an issue form whose YAML is invalid or breaks the form
# schema, so the template disappears from the issue chooser with no error
# anywhere. The READMEs are translated by hand, so their structure can drift
# just as silently. Both are checked here on the push that breaks them.

on:
  push:
    paths:
      - '.github/ISSUE_TEMPLATE/**.yml'
      - 'scripts/**.py'
      - 'README.md'
      - 'README.es.md'
      - '.github/workflows/validate-repository-files.yml'
  pull_request:
    paths:
      - '.github/ISSUE_TEMPLATE/**.yml'
      - 'scripts/**.py'
      - 'README.md'
      - 'README.es.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate repository files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: python3 -m pip install --quiet --disable-pip-version-check pyyaml

      - name: Check every issue form and the chooser config
        run: python3 scripts/validate_issue_forms.py

      - name: Check that README.md and README.es.md stay in sync
        run: python3 scripts/check_readmes.py
